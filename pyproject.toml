[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hy3-fintrace"
version = "0.1.0"
description = "Evidence-grounded financial reasoning evaluation and first-error localization"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fintrace = "fintrace.cli:main"

[tool.setuptools.packages.find]
include = ["fintrace*"]

[tool.setuptools.package-data]
fintrace = ["web/*"]
